[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "obsread"
version = "0.1.0"
description = "Read precise Obsidian Markdown sections and block subtrees locally"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["markdown-it-py>=3,<5"]

[project.urls]
Homepage = "https://github.com/hwei/obsread"
Repository = "https://github.com/hwei/obsread"
Issues = "https://github.com/hwei/obsread/issues"

[project.scripts]
obsread = "obsread.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["src/obsread"]

[tool.hatch.build.targets.wheel.force-include]
"skills/obsread" = "obsread/_skill"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/skills", "/docs", "/README.md", "/LICENSE", "/pyproject.toml"]
