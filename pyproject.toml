[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "obsread"
version = "0.1.0"
description = "Read precise Obsidian Markdown sections and block subtrees locally"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["markdown-it-py>=3,<5"]

[project.scripts]
obsread = "obsread.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["src/obsread"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/skills", "/README.md", "/obsread-design.md", "/pyproject.toml"]
