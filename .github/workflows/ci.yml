name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.9.27
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run --locked pytest
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv build --no-sources
      - name: Smoke test installed wheel
        shell: bash
        run: |
          uv venv .smoke
          if [ "$RUNNER_OS" = "Windows" ]; then
            smoke_python=.smoke/Scripts/python.exe
          else
            smoke_python=.smoke/bin/python
          fi
          uv pip install --python "$smoke_python" dist/*.whl
          "$smoke_python" -m obsread --version
          "$smoke_python" -m obsread --help
          "$smoke_python" -c "from importlib.resources import files; from obsread.skills import bundled_files; assert files('obsread').joinpath('_skill', 'SKILL.md').is_file(); assert 'disable-model-invocation: true' in bundled_files('pi')['SKILL.md'].decode()"
